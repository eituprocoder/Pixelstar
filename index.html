<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Go and Fight!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Courier New', Courier, monospace; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* UI Overlays */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: white; z-index: 10; }
        .hidden { display: none !important; }
        
        h1 { font-size: 3rem; color: #ffeb3b; text-shadow: 4px 4px 0 #e91e63; margin-bottom: 10px; }
        input { padding: 15px; font-size: 1.2rem; border: 4px solid #fff; border-radius: 8px; background: #222; color: #fff; outline: none; margin-bottom: 20px; text-align: center; font-family: inherit;}
        button { padding: 15px 40px; font-size: 1.5rem; font-weight: bold; font-family: inherit; cursor: pointer; background: #e91e63; color: white; border: 4px solid #fff; border-radius: 8px; box-shadow: 4px 4px 0 #000; text-transform: uppercase; transition: transform 0.1s; }
        button:active { transform: translate(4px, 4px); box-shadow: none; }
        
        #lobby-info { font-size: 1.5rem; margin-top: 20px; text-align: center; }
        
        /* Floating 3D Labels */
        #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .player-label { position: absolute; transform: translate(-50%, -100%); text-align: center; transition: top 0.05s, left 0.05s; }
        .label-name { font-size: 12px; font-weight: bold; color: white; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; margin-bottom: 4px;}
        .health-bar-bg { width: 60px; height: 8px; background: #333; border: 2px solid #000; border-radius: 4px; overflow: hidden; }
        .health-bar-fill { height: 100%; background: #4caf50; width: 100%; transition: width 0.2s; }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }
        #status-bar { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px 0 #000; font-size: 1.2rem; }
        
        /* Controls */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; touch-action: none; display: flex; justify-content: center; align-items: center; }
        #joystick-stick { width: 60px; height: 60px; background: rgba(255,255,255,0.6); border-radius: 50%; position: absolute; }
        
        #action-buttons { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; pointer-events: auto; }
        .action-btn { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(233, 30, 99, 0.7); border: 3px solid rgba(255,255,255,0.8); color: white; font-weight: bold; font-family: inherit; font-size: 12px; }
        #btn-attack { bottom: 20px; left: 20px; width: 80px; height: 80px; background: rgba(244, 67, 54, 0.8); font-size: 14px;}
        #btn-jump { top: 20px; right: 20px; }
        #btn-dash { bottom: 20px; right: -10px; background: rgba(33, 150, 243, 0.8);}
        
        @media (min-width: 768px) {
            #joystick-zone, #action-buttons { display: none; }
            #pc-instructions { position: absolute; bottom: 20px; right: 20px; color: white; text-shadow: 2px 2px 0 #000; text-align: right; pointer-events: none; }
        }
        @media (max-width: 767px) { #pc-instructions { display: none; } }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen">
        <h1>Go and Fight!</h1>
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="12" value="Hero">
        <button id="play-btn">Play</button>
        <p style="margin-top: 20px; color: #aaa; max-width: 400px; text-align: center;">
            Rule the arena. 15s countdown starts when 2 players join. Passively heal over time. Last survivor wins!
        </p>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <h1>Waiting Room</h1>
        <div id="lobby-info">Connecting to server...</div>
    </div>

    <div id="win-screen" class="screen hidden">
        <h1>VICTORY!</h1>
        <p>You are the last survivor!</p>
        <button onclick="location.reload()">Play Again</button>
    </div>
    <div id="lose-screen" class="screen hidden">
        <h1>YOU DIED</h1>
        <p>Better luck next time.</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="labels-container"></div>
        <div id="hud">
            <div id="status-bar">Alive: <span id="alive-count">0</span></div>
            <div id="joystick-zone"><div id="joystick-stick"></div></div>
            <div id="action-buttons">
                <button id="btn-attack" class="action-btn">ATTACK<br>(F)</button>
                <button id="btn-jump" class="action-btn">JUMP<br>(Space)</button>
                <button id="btn-dash" class="action-btn">DASH<br>(Shift)</button>
            </div>
            <div id="pc-instructions">
                <b>WASD</b> - Move<br>
                <b>SPACE</b> - Jump<br>
                <b>SHIFT</b> - Dash<br>
                <b>F / Click</b> - Attack
            </div>
        </div>
    </div>

<script>
/** * 16-BIT AUDIO ENGINE (Web Audio API)
 */
const AudioEngine = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTone(type, freq1, freq2, duration, vol=0.1) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.frequency.setValueAtTime(freq1, this.ctx.currentTime);
        if(freq2) osc.frequency.exponentialRampToValueAtTime(freq2, this.ctx.currentTime + duration);
        
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    sfx: {
        attack: () => AudioEngine.playTone('square', 400, 150, 0.15, 0.1),
        jump: () => AudioEngine.playTone('sine', 300, 600, 0.2, 0.1),
        dash: () => AudioEngine.playTone('sawtooth', 200, 50, 0.2, 0.1),
        hit: () => AudioEngine.playTone('square', 150, 50, 0.2, 0.2),
        win: () => {
            const notes = [440, 554, 659, 880];
            notes.forEach((f, i) => setTimeout(() => AudioEngine.playTone('square', f, f, 0.2, 0.1), i * 150));
        },
        lose: () => {
            const notes = [300, 250, 200, 150];
            notes.forEach((f, i) => setTimeout(() => AudioEngine.playTone('sawtooth', f, f, 0.3, 0.2), i * 300));
        }
    }
};

/**
 * GLOBALS & STATE
 */
const GLOBAL_ROOM_ID = 'go-and-fight-arena-public-v1';
let peer, conn, myId;
let isHost = false;
let gameStarted = false;
let playerName = "Hero";

// Game State structure
let gameState = {
    status: 'waiting', // waiting, countdown, playing, finished
    countdown: 15,
    players: {} // id: {x, y, z, hp, name, color, rot, attacking, isDead, score}
};

// Input State
const keys = { w:false, a:false, s:false, d:false, space:false, shift:false, f:false };
const joy = { x: 0, y: 0 };
let localInput = { moveX: 0, moveY: 0, jump: false, dash: false, attack: false };

/**
 * THREE.JS ENGINE
 */
let scene, camera, renderer, clock;
let playerMeshes = {};
let playerLabels = {};
let arenaSize = 60;
let localVelocity = new THREE.Vector3();
let gravity = -20;
let isGrounded = true;

function initThreeJS() {
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('game-canvas');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky blue
    
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    
    clock = new THREE.Clock();

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -arenaSize;
    dirLight.shadow.camera.right = arenaSize;
    dirLight.shadow.camera.top = arenaSize;
    dirLight.shadow.camera.bottom = -arenaSize;
    scene.add(dirLight);

    // Arena Floor
    const gridHelper = new THREE.GridHelper(arenaSize, 30, 0x000000, 0x444444);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);
    
    const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Walls
    const wallGeo = new THREE.BoxGeometry(arenaSize, 5, 2);
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const positions = [
        [0, 2.5, -arenaSize/2], [0, 2.5, arenaSize/2],
        [-arenaSize/2, 2.5, 0], [arenaSize/2, 2.5, 0]
    ];
    positions.forEach((pos, i) => {
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(...pos);
        if(i > 1) wall.rotation.y = Math.PI / 2;
        wall.castShadow = true; wall.receiveShadow = true;
        scene.add(wall);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function createPlayerModel(colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: colorHex });
    
    // Body parts
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat);
    head.position.y = 2.4; head.castShadow = true; group.add(head);
    
    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), mat);
    torso.position.y = 1.3; torso.castShadow = true; group.add(torso);
    
    // Arms
    const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat);
    rArm.position.set(0.8, 1.5, 0); rArm.castShadow = true;
    const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat);
    lArm.position.set(-0.8, 1.5, 0); lArm.castShadow = true;
    group.add(rArm); group.add(lArm);
    
    // Legs
    const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat);
    rLeg.position.set(0.3, 0.6, 0); rLeg.castShadow = true;
    const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat);
    lLeg.position.set(-0.3, 0.6, 0); lLeg.castShadow = true;
    group.add(rLeg); group.add(lLeg);
    
    // Sword
    const swordPivot = new THREE.Group();
    swordPivot.position.set(0, -0.4, 0.2); // Attached to bottom of right arm
    const sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2, 0.2), new THREE.MeshLambertMaterial({color: 0xcccccc}));
    sword.position.set(0, 0.8, 0); // Pointing forward/up
    sword.castShadow = true;
    swordPivot.add(sword);
    swordPivot.rotation.x = Math.PI / 2; // Default point forward
    rArm.add(swordPivot);

    group.userData = { walkCycle: 0, rArm, lArm, rLeg, lLeg, swordPivot, attackingTimer: 0 };
    return group;
}

function updateLabels() {
    Object.keys(playerLabels).forEach(id => {
        if (!playerMeshes[id]) return;
        const mesh = playerMeshes[id];
        if(gameState.players[id] && gameState.players[id].isDead) {
            playerLabels[id].div.style.display = 'none';
            return;
        }
        
        // Project 3D pos to 2D screen
        const pos = mesh.position.clone();
        pos.y += 3.5; // Above head
        pos.project(camera);
        
        if(pos.z > 1) { // Behind camera
            playerLabels[id].div.style.display = 'none';
            return;
        }
        
        const x = (pos.x * .5 + .5) * window.innerWidth;
        const y = (pos.y * -.5 + .5) * window.innerHeight;
        
        playerLabels[id].div.style.display = 'block';
        playerLabels[id].div.style.left = `${x}px`;
        playerLabels[id].div.style.top = `${y}px`;
        playerLabels[id].fill.style.width = `${gameState.players[id].hp}%`;
    });
}

function syncScene() {
    let alive = 0;
    Object.keys(gameState.players).forEach(id => {
        const p = gameState.players[id];
        
        // Instantiate if missing
        if(!playerMeshes[id]) {
            const mesh = createPlayerModel(p.color);
            scene.add(mesh);
            playerMeshes[id] = mesh;
            
            // Create DOM label
            const div = document.createElement('div');
            div.className = 'player-label';
            div.innerHTML = `
                <div class="label-name">${p.name}</div>
                <div class="health-bar-bg"><div class="health-bar-fill" id="hp-${id}"></div></div>
            `;
            document.getElementById('labels-container').appendChild(div);
            playerLabels[id] = { div, fill: div.querySelector(`#hp-${id}`) };
        }
        
        const mesh = playerMeshes[id];
        
        if (p.isDead) {
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = 0.5;
            return;
        }
        
        alive++;
        
        // Interpolate position
        mesh.position.lerp(new THREE.Vector3(p.x, p.y, p.z), 0.3);
        
        // Animation
        const speed = new THREE.Vector2(p.x - mesh.position.x, p.z - mesh.position.z).length();
        if(speed > 0.01) {
            mesh.userData.walkCycle += 0.2;
            const rot = Math.sin(mesh.userData.walkCycle) * 0.5;
            mesh.userData.rArm.rotation.x = -rot;
            mesh.userData.lArm.rotation.x = rot;
            mesh.userData.rLeg.rotation.x = rot;
            mesh.userData.lLeg.rotation.x = -rot;
            
            // Smooth rotation towards movement
            const targetRot = Math.atan2(p.x - mesh.position.x, p.z - mesh.position.z);
            mesh.rotation.y = targetRot;
        } else {
            mesh.userData.rArm.rotation.x = 0; mesh.userData.lArm.rotation.x = 0;
            mesh.userData.rLeg.rotation.x = 0; mesh.userData.lLeg.rotation.x = 0;
        }
        
        // Attack Animation
        if(p.attacking && mesh.userData.attackingTimer <= 0) {
            mesh.userData.attackingTimer = 15; // frames
            if(id !== myId) AudioEngine.sfx.attack(); // Play network attack sound
        }
        if(mesh.userData.attackingTimer > 0) {
            mesh.userData.attackingTimer--;
            mesh.userData.rArm.rotation.x = -Math.PI/2; // Raise arm
            mesh.userData.swordPivot.rotation.x = mesh.userData.attackingTimer % 4 < 2 ? Math.PI : Math.PI/2; // Slash
        } else {
            mesh.userData.swordPivot.rotation.x = Math.PI/2; // Reset
        }
    });

    // Cleanup disconnected players
    Object.keys(playerMeshes).forEach(id => {
        if(!gameState.players[id]) {
            scene.remove(playerMeshes[id]);
            playerLabels[id].div.remove();
            delete playerMeshes[id];
            delete playerLabels[id];
        }
    });

    document.getElementById('alive-count').innerText = alive;
    updateLabels();

    // Camera follow local player
    if(playerMeshes[myId]) {
        const mp = playerMeshes[myId].position;
        camera.position.lerp(new THREE.Vector3(mp.x, mp.y + 12, mp.z + 15), 0.1);
        camera.lookAt(mp);
    }
}

/**
 * INPUT HANDLING
 */
function setupInputs() {
    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', e => {
        if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
    });
    window.addEventListener('mousedown', () => { if(gameStarted) keys['f'] = true; });
    window.addEventListener('mouseup', () => { if(gameStarted) keys['f'] = false; });

    // Touch Joystick
    const joyZone = document.getElementById('joystick-zone');
    const joyStick = document.getElementById('joystick-stick');
    let joyActive = false;
    let joyCenter = {x:0, y:0};
    
    joyZone.addEventListener('pointerdown', e => {
        joyActive = true;
        const rect = joyZone.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        updateJoystick(e);
    });
    window.addEventListener('pointermove', e => { if(joyActive) updateJoystick(e); });
    window.addEventListener('pointerup', () => { 
        joyActive = false; joy.x = 0; joy.y = 0;
        joyStick.style.transform = `translate(0px, 0px)`;
    });

    function updateJoystick(e) {
        let dx = e.clientX - joyCenter.x;
        let dy = e.clientY - joyCenter.y;
        const maxDist = 40;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist > maxDist) {
            dx = (dx/dist) * maxDist;
            dy = (dy/dist) * maxDist;
        }
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        joy.x = dx / maxDist;
        joy.y = dy / maxDist;
    }

    // Touch Action Buttons
    const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
    };
    bindBtn('btn-attack', 'f');
    bindBtn('btn-jump', 'space');
    bindBtn('btn-dash', 'shift');
}

function processLocalInput() {
    if(!gameStarted || gameState.status !== 'playing' || gameState.players[myId].isDead) {
        localInput = { moveX: 0, moveY: 0, jump: false, dash: false, attack: false };
        return;
    }
    
    let mx = joy.x, my = joy.y;
    if(keys.a) mx -= 1; if(keys.d) mx += 1;
    if(keys.w) my -= 1; if(keys.s) my += 1;
    
    // Normalize keyboard diag
    const len = Math.sqrt(mx*mx + my*my);
    if(len > 1) { mx /= len; my /= len; }

    localInput.moveX = mx;
    localInput.moveY = my;
    
    // Trigger Actions (one shots)
    localInput.jump = keys.space;
    localInput.dash = keys.shift;
    localInput.attack = keys.f;
    
    if(keys.f) { keys.f = false; } // Reset immediately so it pulses
    if(keys.shift) { keys.shift = false; }
    if(keys.space) { keys.space = false; }
}


/**
 * NETWORKING & GAME LOGIC
 */
let clients = {}; // Host uses this to track connections

function setupHost() {
    isHost = true;
    peer.on('connection', (connection) => {
        const cid = connection.peer;
        clients[cid] = connection;
        
        connection.on('data', (data) => {
            if(data.type === 'join') {
                if(Object.keys(gameState.players).length >= 8 || gameState.status === 'playing') {
                    connection.send({type: 'rejected'});
                    return;
                }
                addPlayer(cid, data.name);
            } else if (data.type === 'input') {
                handleClientInput(cid, data.input);
            }
        });
        connection.on('close', () => { delete clients[cid]; delete gameState.players[cid]; });
        connection.on('error', () => { delete clients[cid]; delete gameState.players[cid]; });
    });

    // Host loops
    setInterval(hostGameLoop, 1000 / 30); // 30 ticks physics
    setInterval(hostSyncState, 1000 / 15); // 15 syncs/sec
    setInterval(hostHealAndLobby, 1000); // 1s tick
}

function setupClient(connection) {
    conn = connection;
    conn.on('open', () => {
        conn.send({ type: 'join', name: playerName });
    });
    conn.on('data', (data) => {
        if(data.type === 'state') {
            gameState = data.state;
            checkGameState();
        } else if(data.type === 'hit') {
            AudioEngine.sfx.hit();
        } else if(data.type === 'rejected') {
            alert('Room full or game already started!');
            location.reload();
        }
    });
    setInterval(() => {
        if(gameStarted && conn.open) conn.send({type: 'input', input: localInput});
    }, 1000 / 20); // Send input 20x sec
}

function addPlayer(id, name) {
    const r = () => Math.random() * 20 - 10;
    gameState.players[id] = {
        name: name,
        color: Math.random() * 0xffffff,
        x: r(), y: 0, z: r(),
        vx: 0, vy: 0, vz: 0,
        hp: 100, isDead: false, attacking: false,
        cooldown: 0
    };
}

// Host-side physics and logic
function hostGameLoop() {
    const dt = 1/30;
    const speed = 15;
    
    Object.keys(gameState.players).forEach(id => {
        const p = gameState.players[id];
        if(p.isDead) return;
        
        if(p.cooldown > 0) p.cooldown -= dt;
        p.attacking = false;
        
        // Physics
        p.vy += gravity * dt;
        p.y += p.vy * dt;
        if(p.y < 0) {
            p.y = 0; p.vy = 0;
            // Floor drag
            p.vx *= 0.8; p.vz *= 0.8;
        }

        p.x += p.vx * dt;
        p.z += p.vz * dt;
        
        // Boundaries
        const b = arenaSize/2 - 1;
        if(p.x < -b) p.x = -b; if(p.x > b) p.x = b;
        if(p.z < -b) p.z = -b; if(p.z > b) p.z = b;
    });
    
    // Process local host inputs identically
    if(gameStarted) handleClientInput(myId, localInput);
}

function handleClientInput(id, input) {
    const p = gameState.players[id];
    if(!p || p.isDead || gameState.status !== 'playing') return;
    
    // Movement
    if(p.y === 0) {
        p.vx = input.moveX * 10;
        p.vz = input.moveY * 10;
        
        if(input.jump) { p.vy = 12; if(id === myId) AudioEngine.sfx.jump(); else broadcastTo(id, {type:'hit'}); } // Reuse event to trigger audio
        if(input.dash && p.cooldown <= 0) {
            p.vx *= 4; p.vz *= 4; p.cooldown = 1;
            if(id === myId) AudioEngine.sfx.dash(); else broadcastTo(id, {type:'hit'});
        }
    }
    
    // Combat
    if(input.attack && p.cooldown <= 0) {
        p.attacking = true;
        p.cooldown = 0.5; // Attack speed
        if(id === myId) AudioEngine.sfx.attack();
        
        // Collision check
        Object.keys(gameState.players).forEach(targetId => {
            if(id === targetId) return;
            const t = gameState.players[targetId];
            if(t.isDead) return;
            
            const dx = t.x - p.x; const dz = t.z - p.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            if(dist < 3) {
                t.hp -= 15;
                broadcastTo(targetId, {type: 'hit'});
                if(t.hp <= 0) {
                    t.hp = 0; t.isDead = true;
                }
            }
        });
    }
}

function hostSyncState() {
    const stateMsg = { type: 'state', state: gameState };
    Object.values(clients).forEach(c => { if(c.open) c.send(stateMsg); });
    checkGameState(); // Host local check
}

function hostHealAndLobby() {
    const pCount = Object.keys(gameState.players).length;
    
    if(gameState.status === 'waiting') {
        if(pCount >= 2) gameState.status = 'countdown';
    } 
    else if (gameState.status === 'countdown') {
        if(pCount < 2) { gameState.status = 'waiting'; gameState.countdown = 15; }
        else {
            gameState.countdown--;
            if(gameState.countdown <= 0) gameState.status = 'playing';
        }
    }
    else if (gameState.status === 'playing') {
        // Passive Heal
        Object.values(gameState.players).forEach(p => {
            if(!p.isDead && p.hp < 100) p.hp = Math.min(100, p.hp + 2);
        });
        
        // Win condition
        const alive = Object.values(gameState.players).filter(p => !p.isDead).length;
        if(alive <= 1) gameState.status = 'finished';
    }
}

function broadcastTo(id, msg) {
    if(id === myId) {
        if(msg.type === 'hit') AudioEngine.sfx.hit();
    } else {
        if(clients[id] && clients[id].open) clients[id].send(msg);
    }
}

// Client & Host shared visual state update
let gameResultTriggered = false;
function checkGameState() {
    // Lobby UI
    if(gameState.status === 'waiting') {
        document.getElementById('lobby-info').innerText = `Waiting for players... (${Object.keys(gameState.players).length}/8)`;
    } else if (gameState.status === 'countdown') {
        document.getElementById('lobby-info').innerText = `Match starting in ${gameState.countdown}s... (${Object.keys(gameState.players).length}/8)`;
    } else if (gameState.status === 'playing' && !gameStarted) {
        gameStarted = true;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('hud').style.display = 'block';
    }
    
    // Win/Lose condition checking
    if(gameStarted && !gameResultTriggered) {
        const me = gameState.players[myId];
        if(me && me.isDead) {
            gameResultTriggered = true;
            setTimeout(() => {
                document.getElementById('lose-screen').classList.remove('hidden');
                AudioEngine.sfx.lose();
            }, 1000);
        } else if (gameState.status === 'finished') {
            gameResultTriggered = true;
            setTimeout(() => {
                document.getElementById('win-screen').classList.remove('hidden');
                AudioEngine.sfx.win();
            }, 1000);
        }
    }
}


/**
 * MAIN LOOP
 */
function animate() {
    requestAnimationFrame(animate);
    if(gameStarted) {
        processLocalInput();
        syncScene();
        renderer.render(scene, camera);
    }
}

/**
 * INIT & BOOTSTRAP
 */
document.getElementById('play-btn').addEventListener('click', () => {
    const inputName = document.getElementById('player-name').value.trim();
    if(inputName) playerName = inputName;
    
    AudioEngine.init(); // Initialize audio context on user gesture
    
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('lobby-screen').classList.remove('hidden');
    
    initThreeJS();
    setupInputs();

    // Matchmaking Logic
    peer = new Peer(GLOBAL_ROOM_ID);
    
    peer.on('error', (err) => {
        if(err.type === 'unavailable-id') {
            // Room exists, join as client
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                const conn = peer.connect(GLOBAL_ROOM_ID);
                setupClient(conn);
            });
        } else {
            document.getElementById('lobby-info').innerText = "Network Error. Please try again.";
        }
    });
    
    peer.on('open', (id) => {
        if(id === GLOBAL_ROOM_ID) {
            // Successfully claimed host ID
            myId = id;
            setupHost();
            addPlayer(myId, playerName); // Host plays too
            checkGameState();
        }
    });
    
    animate(); // Start render loop (waits for gameStarted flag)
});

</script>
